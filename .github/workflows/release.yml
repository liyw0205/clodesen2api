name: Build Release Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        if: matrix.go == 'stable'
        run: go test -race ./internal/...

  web:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner browser
        run: google-chrome --version
      - run: npm run test:web
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/*.png

  package:
    name: Package ${{ matrix.name }}
    needs: [test, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            archive: zip
            binary: clodesen2api
          - name: linux-arm64
            goos: linux
            goarch: arm64
            archive: zip
            binary: clodesen2api
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
            archive: zip
            binary: clodesen2api
          - name: android-arm64-termux
            goos: android
            goarch: arm64
            buildmode: pie
            archive: zip
            binary: clodesen2api
          - name: windows-amd64
            goos: windows
            goarch: amd64
            archive: zip
            binary: clodesen2api.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          BUILD_VERSION="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$BUILD_VERSION" ]; then
            echo 'Release tag does not match VERSION' >&2
            exit 1
          fi
          mkdir -p build/${{ matrix.name }}/bin
          go build ${{ matrix.buildmode && format('-buildmode={0}', matrix.buildmode) || '' }} \
            -trimpath -ldflags "-s -w -X main.version=$BUILD_VERSION -X main.goarm=${GOARM:-7}" \
            -o build/${{ matrix.name }}/bin/${{ matrix.binary }} ./cmd/clodesen2api
      - name: Assemble package
        env:
          TARGET: ${{ matrix.name }}
          ARCHIVE: clodesen2api-${{ matrix.name }}
          WINDOWS: ${{ matrix.goos == 'windows' && '1' || '0' }}
        run: |
          cp config.example.toml build/$TARGET/
          cp README.md Makefile VERSION THIRD_PARTY_NOTICES.md go.mod go.sum package.json package-lock.json build/$TARGET/
          cp -R docs build/$TARGET/
          cp -R cmd internal tests build/$TARGET/
          if [ "$WINDOWS" = "1" ]; then
            cp start.bat stop.bat restart.bat build/$TARGET/
            (cd build/$TARGET && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE.zip" .)
          else
            cp start.sh stop.sh restart.sh build/$TARGET/
            chmod +x build/$TARGET/*.sh build/$TARGET/bin/*
            (cd build/$TARGET && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE.zip" .)
          fi
          sha256sum "$ARCHIVE".* > "$ARCHIVE.sha256"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: clodesen2api-${{ matrix.name }}
          path: |
            clodesen2api-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: clodesen2api-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$VERSION" --notes-file "docs/releases/$VERSION.md"
