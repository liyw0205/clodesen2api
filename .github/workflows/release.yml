name: Build Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  package:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            archive: tar.gz
            binary: clodesen2api
          - name: linux-arm64
            goos: linux
            goarch: arm64
            archive: tar.gz
            binary: clodesen2api
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
            archive: tar.gz
            binary: clodesen2api
          - name: android-arm64-termux
            goos: android
            goarch: arm64
            buildmode: pie
            archive: tar.gz
            binary: clodesen2api
          - name: windows-amd64
            goos: windows
            goarch: amd64
            archive: zip
            binary: clodesen2api.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p build/${{ matrix.name }}/bin
          go build ${{ matrix.buildmode && format('-buildmode={0}', matrix.buildmode) || '' }} \
            -trimpath -ldflags '-s -w' \
            -o build/${{ matrix.name }}/bin/${{ matrix.binary }} ./cmd/clodesen2api
      - name: Assemble package
        env:
          TARGET: ${{ matrix.name }}
          ARCHIVE: clodesen2api-${{ matrix.name }}
          WINDOWS: ${{ matrix.goos == 'windows' && '1' || '0' }}
        run: |
          cp config.example.toml build/$TARGET/
          cp README.md Makefile go.mod go.sum build/$TARGET/
          cp -R cmd internal build/$TARGET/
          if [ "$WINDOWS" = "1" ]; then
            cp start.bat stop.bat restart.bat build/$TARGET/
            (cd build/$TARGET && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE.zip" .)
          else
            cp start.sh stop.sh restart.sh build/$TARGET/
            chmod +x build/$TARGET/*.sh build/$TARGET/bin/*
            tar -czf "$ARCHIVE.tar.gz" -C build/$TARGET .
          fi
          sha256sum "$ARCHIVE".* > "$ARCHIVE.sha256"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: clodesen2api-${{ matrix.name }}
          path: |
            clodesen2api-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: clodesen2api-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
